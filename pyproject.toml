[project]
name = "fact"
version = "0.1.0"
description = "Evidence-status fact-checking backend (Marathi / Hindi / Hinglish / English)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Self-hosted models for MOCK_MODE=false (BGE-M3 embedder, mDeBERTa NLI). ~3 GB of weights on first use.
# For a CPU-only torch: pip install --index-url https://download.pytorch.org/whl/cpu torch  (before this)
models = ["torch>=2.4", "sentence-transformers>=3.0", "transformers>=4.44", "sentencepiece>=0.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "crawler*"]
