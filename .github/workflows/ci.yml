name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fact
          POSTGRES_PASSWORD: fact
          POSTGRES_DB: fact_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fact -d fact_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fact:fact@localhost:5432/fact_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Migrations are in sync with the models
        env:
          DATABASE_URL: postgresql+asyncpg://fact:fact@localhost:5432/fact_test
        run: |
          python -m app.db.migrate
          alembic check
      - name: Tests (offline + Postgres; live API/model tests stay skipped)
        run: pytest -q
      - name: Eval smoke (mock mode, synthetic set)
        run: python -m eval.run --split all
      - name: Compose file is valid
        run: docker compose config --quiet
