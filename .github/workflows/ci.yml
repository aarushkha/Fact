name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fact
          POSTGRES_PASSWORD: fact
          POSTGRES_DB: fact_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fact -d fact_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fact:fact@localhost:5432/fact_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Migrations are in sync with the models
        env:
          DATABASE_URL: postgresql+asyncpg://fact:fact@localhost:5432/fact_test
        run: |
          python -m app.db.migrate
          alembic check
      - name: Tests (offline + Postgres; live API/model tests stay skipped)
        run: pytest -q
      - name: Eval smoke (mock mode, synthetic set)
        run: python -m eval.run --split all
      - name: Compose file is valid
        run: docker compose config --quiet
