services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fact
      POSTGRES_PASSWORD: fact
      POSTGRES_DB: fact
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fact -d fact"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        INSTALL_MODELS: ${INSTALL_MODELS:-false}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://fact:fact@db:5432/fact
    ports:
      - "8000:8000"
    volumes:
      - hfcache:/root/.cache/huggingface  # model weights survive container rebuilds
    depends_on:
      db:
        condition: service_healthy

  worker:  # rechecks UNVERIFIED claims and crawls sources on a schedule
    build:
      context: .
      args:
        INSTALL_MODELS: ${INSTALL_MODELS:-false}
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://fact:fact@db:5432/fact
    volumes:
      - hfcache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

  models:  # embedder + NLI server; enable with: docker compose --profile models up
    profiles: ["models"]
    build:
      context: .
      args:
        INSTALL_MODELS: "true"
    command: ["uvicorn", "app.model_server:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8001:8001"  # loopback only: /embed and /nli are open unless MODEL_SERVER_TOKEN is set
    volumes:
      - hfcache:/root/.cache/huggingface

volumes:
  pgdata:
  hfcache:
