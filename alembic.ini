# Alembic CLI config. The app runs migrations itself at startup (app/db/migrate.py);
# use the CLI for new revisions:  alembic revision --autogenerate -m "message"
[alembic]
script_location = app/db/migrations
prepend_sys_path = .

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
