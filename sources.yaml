# Whitelist of evidence sources. ONLY these count as evidence.
#
# tier: 1 = primary (police, courts, government, institutions, wire services)
#       2 = original reporting (outlets doing their own reporting, fact-checkers)
#       3 = aggregator (outlets that mostly repeat social-media posts)
# kind: police | court | government | institution | wire | outlet | factchecker | aggregator
# rss_url / sitemap_url: real feed URLs only; leave empty if unknown. Do not guess.
# todo: true -> entry is ignored until filled in.

sources:
